nano ui/index.html<!DOCTYPE html>
<html>
<head>
    <title>Prescriptive Maintenance AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 17px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            white-space: pre-wrap;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔧 Prescriptive Maintenance AI</h1>

    <p>Enter machine problem:</p>

    <textarea id="problem"
        placeholder="Example: CNC machine shows ERROR CODE E101 and abnormal vibration. What should be done?"></textarea>

    <button onclick="getRecommendation()">
        Get Maintenance Recommendation
    </button>

    <div id="result">
        Recommendation will appear here...
    </div>

</div>

<script>

async function getRecommendation() {

    const problem = document.getElementById("problem").value;

    if (!problem) {
        alert("Please enter a machine problem.");
        return;
    }

    document.getElementById("result").innerText = "Analyzing machine problem...";

    try {

        const response = await fetch("https://silver-halibut-wvrjpjpjq6q9fg4vx-8000.app.github.dev/maintenance", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                problem: problem
            })
        });

        const data = await response.json();

        document.getElementById("result").innerText =
            data.recommendation || JSON.stringify(data, null, 2);

    } catch (error) {

        document.getElementById("result").innerText =
            "Error connecting to maintenance API.";

    }
}

</script>

</body>
</html>
